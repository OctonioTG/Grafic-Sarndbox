# =====================================================================
#  CONFIGURACIÓN DEL AR SANDBOX + PANEL
# =====================================================================
#  Este es el ÚNICO archivo que hay que editar en la computadora del
#  sandbox. Las líneas que empiezan con # son comentarios (no hacen nada).
#
#  Reglas para editar:
#    - Escribe los valores entre comillas:   PUERTO="8000"
#    - No pongas espacios alrededor del =
#    - "$HOME" significa tu carpeta personal (por ejemplo /home/sandbox)
#    - Si dejas un valor vacío ("") el programa intenta detectarlo solo.
#
#  Después de editar, guarda y vuelve a abrir el ícono "AR Sandbox".
#  Para revisar sin abrir nada:   ./iniciar_sandbox.sh --revisar
# =====================================================================


# ---------------------------------------------------------------------
# 1. PROGRAMA SARndbox
# ---------------------------------------------------------------------

# Ruta completa del programa SARndbox.
# Vacío = buscarlo solo (en el PATH, ~/src/SARndbox-*/bin, /usr/local/bin,
# /opt/SARndbox-*/bin, ~/SARndbox-*/bin y en la carpeta SARndbox-2.6 de
# este repositorio si ahí se compiló).
# Ejemplo:  SARNDBOX_EJECUTABLE="$HOME/src/SARndbox-2.6/bin/SARndbox"
# VERIFICAR EN LA COMPUTADORA DEL SANDBOX: dónde está instalado.
SARNDBOX_EJECUTABLE=""


# ---------------------------------------------------------------------
# 2. CALIBRACIÓN (estos archivos NUNCA se modifican, solo se leen)
# ---------------------------------------------------------------------

# Archivo con la forma de la caja (lo crea el paso de calibración del Kinect).
# Vacío = buscar BoxLayout.txt en la carpeta etc/SARndbox-X.Y junto al programa.
# Ejemplo:  ARCHIVO_BOXLAYOUT="$HOME/src/SARndbox-2.6/etc/SARndbox-2.6/BoxLayout.txt"
# VERIFICAR EN LA COMPUTADORA DEL SANDBOX.
ARCHIVO_BOXLAYOUT=""

# Archivo con la calibración del proyector (lo crea CalibrateProjector).
# Vacío = buscar ProjectorMatrix.dat en la misma carpeta que BoxLayout.txt.
# VERIFICAR EN LA COMPUTADORA DEL SANDBOX.
ARCHIVO_PROYECTOR=""


# ---------------------------------------------------------------------
# 3. OPCIONES DE ARRANQUE DEL SARndbox
# ---------------------------------------------------------------------

# Opciones extra. "-uhm" = colores por altura (como en el manual oficial).
# El lanzador ya agrega por su cuenta: -slf (caja), -fpv (proyector) y -ws (agua).
# Si en la computadora ya lo arrancaban con otras opciones (por ejemplo
# -ucl para curvas de nivel, -rer, -evr ...), cópialas aquí.
# VERIFICAR EN LA COMPUTADORA DEL SANDBOX: con qué opciones lo arrancaban antes.
OPCIONES_SARNDBOX="-uhm"

# Simulación de agua. En SARndbox 2.6 el agua está encendida mientras la
# velocidad sea MAYOR que 0 (opción -ws <velocidad> <pasos máximos>).
# La herramienta para guardar el relieve SOLO existe con el agua encendida,
# así que la velocidad nunca debe ser 0.
AGUA_VELOCIDAD="1.0"

# Calidad de la simulación de agua (cuánto trabaja la tarjeta de video).
# El agua se calcula sobre una "malla" (cuadrícula) y en varios pasos por cuadro.
# Menos cuadros en la malla = menos trabajo, y además cada paso puede ser más largo.
#
#   "alta"   = como viene el SARndbox: malla 640 x 480, hasta 30 pasos por cuadro.
#   "media"  = malla 480 x 360, hasta 20 pasos. Unas 2 a 3 veces más ligera;
#              en la caja casi no se nota la diferencia.            (recomendada)
#   "ligera" = malla 320 x 240, hasta 12 pasos. Unas 6 a 8 veces más ligera;
#              las orillas del agua se ven un poco menos finas.
#   "manual" = usa exactamente AGUA_MALLA y AGUA_PASOS_MAXIMOS de abajo.
#
# Si la computadora no alcanza, el agua se mueve más LENTO, pero no se rompe.
# El lanzador avisa en el registro (logs/) si pasa seguido; entonces bajen un nivel.
#
# Ojo: el relieve que se guarda para el panel tiene el MISMO tamaño que esta
# malla. Con "media" o "ligera" el panel recibe menos puntos (sigue siendo
# suficiente para el análisis, y el panel trabaja más rápido).
#
# VERIFICAR EN LA COMPUTADORA DEL SANDBOX: empezar con "media"; si el agua se
# ve fluida, se puede probar "alta". Si va trabada, "ligera".
CALIDAD_AGUA="media"

# Solo con CALIDAD_AGUA="manual":
AGUA_MALLA="640 480"
AGUA_PASOS_MAXIMOS="30"


# ---------------------------------------------------------------------
# 4. GUARDAR EL RELIEVE (herramienta BathymetrySaverTool)
# ---------------------------------------------------------------------

# Dónde se guarda el relieve cada vez que se presiona la tecla.
# Recomendado: una ruta SIN espacios ni acentos.
# El SARndbox se arranca DESDE esta carpeta, así que aunque Vrui no lea
# nuestra configuración, el archivo con su nombre normal
# (BathymetrySaverTool.dem) cae aquí mismo. Por eso conviene dejar el
# nombre del archivo como está.
RUTA_DEM="$HOME/SARndbox-capturas/BathymetrySaverTool.dem"

# Tecla que guarda el relieve. Letra minúscula, número o nombre de tecla
# de Vrui (por ejemplo: g, 9, F5).
# VERIFICAR EN LA COMPUTADORA DEL SANDBOX: que la tecla no la use ya otra
# herramienta (en el SARndbox normalmente se usan 1 y 2 para el agua).
TECLA_GUARDAR="g"

# Cómo le damos a Vrui (la base del SARndbox) la tecla y la ruta del .dem:
#   "mergeConfig" = se arranca con la opción -mergeConfig y un archivo que
#                   genera el lanzador. No toca ningún archivo del SARndbox.
#                   (Recomendado. VERIFICAR que la versión de Vrui la acepte:
#                   si no, el registro dice "Ignoring unrecognized command
#                   line switch -mergeConfig" y el lanzador te avisa.)
#   "usuario"     = el lanzador escribe ~/.config/Vrui-<versión>/Applications/SARndbox.cfg
#                   (hace respaldo antes si ya existía uno). VERIFICAR que
#                   esa versión de Vrui lea esa carpeta.
#   "manual"      = no se configura nada; la tecla se asigna a mano cada vez
#                   (ver LEEME.md, sección "Asignar la tecla a mano").
METODO_CONFIG_VRUI="mergeConfig"

# Versión de Vrui (solo se usa con METODO_CONFIG_VRUI="usuario").
# Vacío = detectarla (busca /usr/local/etc/Vrui-* y ~/Vrui-*).
# SARndbox 2.6 usa Vrui 4.6.  VERIFICAR EN LA COMPUTADORA DEL SANDBOX.
VRUI_VERSION=""

# Sección raíz de Vrui donde va nuestra configuración. Normalmente "Desktop".
# OJO: si en Vrui.cfg existe una sección con el nombre de la computadora
# (el "hostname"), Vrui usa esa. VERIFICAR EN LA COMPUTADORA DEL SANDBOX
# (comando:  hostname ).
SECCION_RAIZ_VRUI="Desktop"

# Opciones extra para Vrui (se agregan al final de la línea de arranque).
# Ejemplo si guardaron un "input graph" desde el menú de Vrui:
#   VRUI_OPCIONES_EXTRA="-loadInputGraph $HOME/SARndbox-capturas/teclas.inputgraph"
# (VERIFICAR que esa opción exista en esa versión de Vrui.)
VRUI_OPCIONES_EXTRA=""


# ---------------------------------------------------------------------
# 5. PROYECTOR Y PANTALLA COMPLETA
# ---------------------------------------------------------------------

# Nombre de la salida de video del proyector, como lo muestra el comando
#   xrandr --query
# (por ejemplo HDMI-1, HDMI-0, DP-1, VGA-1).
# "auto" = si hay exactamente 2 pantallas, usar la que NO es la principal.
# VERIFICAR EN LA COMPUTADORA DEL SANDBOX.
MONITOR_PROYECTOR="auto"

# Cómo poner el SARndbox en pantalla completa sobre el proyector:
#   "xdotool" = el lanzador mueve la ventana al proyector y presiona F11
#               (F11 es la tecla que indica el manual oficial). Necesita
#               el programa xdotool (lo instala instalar.sh).
#   "vrui"    = se le pide a Vrui con windowFullscreen/windowPos en la
#               configuración generada. VERIFICAR nombres de opciones.
#   "manual"  = no hacer nada; mover la ventana y presionar F11 a mano.
METODO_PANTALLA_COMPLETA="xdotool"

# Título de la ventana del SARndbox (para encontrarla con xdotool).
# VERIFICAR EN LA COMPUTADORA DEL SANDBOX con:  xdotool search --name SARndbox
TITULO_VENTANA="SARndbox"


# ---------------------------------------------------------------------
# 6. PANEL WEB
# ---------------------------------------------------------------------

# Puerto del panel. Los celulares entran a  http://IP-DE-LA-COMPUTADORA:PUERTO
PUERTO="8000"

# Metros de terreno por cada cm de arena (para el análisis del panel).
# Vacío = el valor del panel (10): 1 cm de arena = 10 m, así un montón de
# 12 cm se vuelve un cerro de 120 m, y los ríos, inundaciones y deslaves
# tienen tamaños de un paisaje real.
# El SARndbox usa por su cuenta otra escala para dibujar (1 cm = 1 m,
# opción -s 100); no afecta al panel. Si prefieren que coincidan, pongan "1",
# pero entonces los cerros serán de unos pocos metros.
# OJO: si cambian la escala desde la ventana de Configuración del panel
# (botón del engrane), ese valor gana sobre este. Con "Restablecer" en esa
# misma ventana se vuelve a usar el de aquí.
ESCALA_METROS_POR_CM=""

# ¿Se puede cambiar la escala y el tipo de suelo desde OTROS equipos
# (celulares, laptops)? (si / no)
# Con "no", solo se pueden cambiar desde la computadora del sandbox; los
# demás solo los ven. Así un alumno no los cambia por accidente.
AJUSTES_DESDE_OTROS_EQUIPOS="no"

# Abrir también el panel en el navegador de la pantalla principal (si / no).
ABRIR_NAVEGADOR="si"

# Mostrar una ventanita con la dirección del panel en la pantalla principal (si / no).
MOSTRAR_DIRECCION="si"


# ---------------------------------------------------------------------
# 7. MODO SIMULACIÓN (probar sin Kinect ni proyector)
# ---------------------------------------------------------------------

# Cada cuántos segundos el SARndbox falso guarda un relieve nuevo.
# 0 = solo cuando presiones Enter en la terminal.
SIMULACION_CADA="20"

# Cuántos segundos dura la simulación antes de "cerrarse" sola.
# 0 = hasta que la cierres (Ctrl+C o la letra q + Enter en la terminal).
SIMULACION_DURACION="0"
